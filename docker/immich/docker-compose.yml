services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${DATA_PATH}/immich:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - IMMICH_TELEMETRY_INCLUDE=all
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    ports:
      - 2283:2283
      - 8081:8081
      - 8082:8082
    # labels:
    #   traefik.enable: true
    #   traefik.http.routers.immich.rule: Host(`immich.${DOMAIN}`)
    #   traefik.http.routers.immich.entrypoints: websecure
    #   traefik.http.routers.immich.tls: true
    #   traefik.http.services.immich.loadbalancer.server.port: 2283
    #   traefik.docker.network: proxy-net
    hostname: immich
    networks:
      #- proxy-net
      - default

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
    networks:
      - immich-internet
      - default

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:c855f98e09d558a0d7cc1a4e56473231206a4c54c0114ada9c485b47aeb92ec8
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DBS_PATH}/immich:/var/lib/postgresql/data
    restart: always

volumes:
  model-cache:
networks:
  # proxy-net:
  #   external: true
  immich-internet:
    driver: bridge
