services:
  syncthing-exporter:
    image: f100024/syncthing_exporter:latest
    container_name: syncthing-exporter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SYNCTHING_URI: "http://syncthing:8384/"
    networks:
      - default
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${DATA_PATH}/syncthing:/config
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
