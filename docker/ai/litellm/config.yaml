include:
  - config/zai.yaml
  - config/nvidia.yaml
  - config/google.yaml
  - config/local.yaml

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 3600
  telemetry: false
  # cache: true
  # enable_caching_on_provider_specific_optional_params: True
  # cache_params:
  #   type: redis
  #   host: localhost
  #   port: 6379

general_settings:
  master_key: ${LITELLM_MASTER_KEY}
  disable_master_key_returned: true
  store_model_in_db: True
  proxy_budget_rescheduler_min_time: 60
  proxy_budget_rescheduler_max_time: 64
  proxy_batch_write_at: 1
  database_connection_pool_limit: 10
  background_health_checks: true
  # use_shared_health_check: true  # needs a coordination Redis (below)
  # coordination_redis:  # standalone Redis for cross-pod coordination: rate limits, spend tracking, pod locks, shared health checks
  #   host: localhost
  #   port: 6379
  cancel_on_disconnect: true
