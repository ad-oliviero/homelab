services:
  api:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - USE_DB_AUTHENTICATION=false
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000/scrape
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=nuq-postgres
      - POSTGRES_PORT=5432
      - NUQ_RABBITMQ_URL=amqp://rabbitmq:5672
      - BULL_AUTH_KEY=${BULL_AUTH_KEY}
      - SEARXNG_ENDPOINT=http://searxng_core:8080
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
    labels:
      traefik.enable: true
      traefik.http.routers.firecrawl.rule: Host(`firecrawl.${DOMAIN}`)
      traefik.http.routers.firecrawl.entrypoints: websecure
      traefik.http.routers.firecrawl.tls: true
      traefik.http.services.firecrawl.loadbalancer.server.port: 3002
      traefik.docker.network: proxy-net
    networks:
      - proxy-net
      - default

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: firecrawl_playwright
    restart: unless-stopped
    environment:
      - PORT=3000
    networks:
      - default

  redis:
    image: redis:alpine
    container_name: firecrawl_redis
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0
    networks:
      - default

  rabbitmq:
    image: rabbitmq:3-management
    container_name: firecrawl_rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: firecrawl_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${DBS_PATH}/firecrawl:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default

networks:
  proxy-net:
    external: true
