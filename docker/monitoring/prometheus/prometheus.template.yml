global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: homelab
    env: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  # - "rules/*.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: wakapi
    metrics_path: /api/metrics
    bearer_token_file: /run/secrets/wakapi_token
    static_configs:
      - targets: ['wakapi:3000']

  - job_name: litellm
    scheme: https
    static_configs:
      - targets: ['litellm.srv.${DOMAIN}']
    authorization:
      credentials_file: /run/secrets/litellm_key

  - job_name: syncthing
    static_configs:
      - targets: ['10.0.0.2:8384']
    metrics_path: /metrics
    http_headers:
      X-API-Key:
        files:
          - /run/secrets/syncthing_key

  - job_name: searxng
    scheme: https
    static_configs:
      - targets: ['searxng.srv.${DOMAIN}']
    metrics_path: /metrics
    basic_auth:
      username: prometheus
      password_file: /run/secrets/searxng_metrics_password

