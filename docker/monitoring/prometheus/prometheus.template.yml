  - job_name: immich_api
    static_configs:
      - targets: ['10.0.0.5:8081']
        labels:
          category: apps
          instance: immich

  - job_name: immich_microservices
    static_configs:
      - targets: ['10.0.0.5:8082']
        labels:
          category: apps
          instance: immich

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          category: infrastructure
          instance: main-node

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          category: infrastructure
          instance: main-node

  - job_name: traefik
    static_configs:
      - targets: ['traefik:8080']
        labels:
          category: infrastructure
          instance: main-node

  - job_name: bitmagnet
    static_configs:
      - targets: ['10.0.0.5:3333']
        labels:
          category: media
          instance: bitmagnet

